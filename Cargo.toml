[package]
name = "teleddns-server"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Co-located DNS management + Dynamic DNS server for a Knot DNS master"
default-run = "teleddns-server"

[[bin]]
name = "teleddns-server"
path = "src/main.rs"

[dependencies]
# relativelylight is consumed from GitHub, pinned to an exact commit for reproducibility. This is the
# 0.2.0 pre-release (CSRF, the DB-backed login lockout + `net::client_ip`, nullable-column handling);
# move to `tag = "v0.2.0"` once it is cut, and to `version = "0.2"` once it is published to crates.io.
# `validate-base64` enables validate::base64 (used for the DNSKEY public-key field check).
relativelylight = { git = "https://github.com/tmshlvck/relativelylight", rev = "ea24d3b3cfb03129c5636dacb72cd0e7c1c7b811", features = ["crud", "axum", "ui", "openapi", "csv", "auth", "sso", "validate-base64"] }

sea-orm = { version = "1.1", features = ["macros", "with-json", "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }

axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }

async-trait = "0.1"
base64 = "0.22"
# Parses a form-encoded POST body on the DDNS endpoint (already in the tree via axum).
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

clap = { version = "4", features = ["derive"] }
askama = "0.13"
utoipa = "5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ipnet = "2"
prometheus = "0.13"
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


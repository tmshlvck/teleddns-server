[package]
name = "teleddns-server"
version = "0.4.5"
edition = "2021"
rust-version = "1.88"   # askama 0.16; relativelylight 0.4.2 (totp-rs 6) declares the same
license = "GPL-3.0-or-later"
description = "Co-located DNS management + Dynamic DNS server for a Knot DNS master"
default-run = "teleddns-server"

[[bin]]
name = "teleddns-server"
path = "src/main.rs"

[dependencies]
# relativelylight from crates.io. `0.4` is one compatible range for a `0.x` crate, so a patch release is
# picked up and a behaviour break (which bumps the minor) is not — usually: 0.4.1 broke in a patch (blob
# removed, `WriteEvent::version` gone, `fixed_filter` pins writes; none touch us). `Cargo.lock` pins the exact version
# either way. 0.3 re-homed the web UI in Rust: `crud::ui` renders server-side HTML and the crate's JSON
# /metadata/OpenAPI surface is gone (there is no `openapi` feature any more), so the console is plain
# MPA and the only documented API is the one this app writes itself (`api/openapi.rs`). 0.4 moved to
# SeaORM 2.0: our entities and connection go straight into the library, so `sea-orm` below must be the
# same major — one SeaORM in the build, not two. 0.4.1 (`Auth::on_error`) is the floor: `app.rs` uses it.
# `validate-base64` enables validate::base64 (used for the DNSKEY public-key field check).
relativelylight = { version = "0.4.1", features = ["crud", "axum", "ui", "csv", "auth", "sso", "validate-base64"] }

sea-orm = { version = "2.0", features = ["macros", "with-json", "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }

axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }

async-trait = "0.1"
base64 = "0.23"
# Parses a form-encoded POST body on the DDNS endpoint (already in the tree via axum).
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml (dtolnay) is archived and pulls the unmaintained `unsafe-libyaml`; `yaml_serde` is the same
# crate and API, continued by the YAML organization. Only `from_str` is used (`config.rs`).
yaml_serde = "0.10"

clap = { version = "4", features = ["derive"] }
# No `config` feature: there is no askama.toml, and it would pull in the unmaintained `basic-toml`
# (RUSTSEC-2026-0374). Since relativelylight 0.4.2 askama is private to the library, so this version is ours.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sha2 = "0.11"
hex = "0.4"
rand = "0.8"
ipnet = "2"
prometheus = "0.14"
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


[package]
name = "teleddns-server"
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Co-located DNS management + Dynamic DNS server for a Knot DNS master"
default-run = "teleddns-server"

[[bin]]
name = "teleddns-server"
path = "src/main.rs"

[dependencies]
# relativelylight from crates.io. `0.2` is one compatible range for a `0.x` crate, so a patch release is
# picked up and a behaviour break (which bumps the minor) is not — `Cargo.lock` pins the exact version
# either way. Before the 0.2.0 release this was a git dependency on an exact commit; there is no reason
# left to carry one. Upgrading to 0.3 will be a read of the library's CHANGELOG §Upgrading, not a bump.
# `validate-base64` enables validate::base64 (used for the DNSKEY public-key field check).
relativelylight = { version = "0.2", features = ["crud", "axum", "ui", "openapi", "csv", "auth", "sso", "validate-base64"] }

sea-orm = { version = "1.1", features = ["macros", "with-json", "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }

axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }

async-trait = "0.1"
base64 = "0.22"
# Parses a form-encoded POST body on the DDNS endpoint (already in the tree via axum).
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

clap = { version = "4", features = ["derive"] }
askama = "0.13"
utoipa = "5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ipnet = "2"
prometheus = "0.13"
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


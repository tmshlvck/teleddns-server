# teleddns-server sample configuration.
#
# Copy to teleddns-server.yaml and run:  teleddns-server -c teleddns-server.yaml
# Without -c the file is looked up as $TELEDDNS_CONFIG, then
# ./teleddns-server.yaml, then /etc/teleddns/teleddns-server.yaml.
#
# Every key is optional — omitted keys fall back to the built-in defaults
# shown in brackets. Durations are strings ("10s", "5m", "2h").

# Database. Scheme picks the engine:
#   sqlite://<path>      SQLite (the file is created if missing)
#   postgres://<dsn...>  PostgreSQL
db_dsn: "sqlite://teleddns.sqlite"
# db_dsn: "postgres://teleddns:secret@localhost:5432/teleddns"

# Address the HTTP server listens on. A leading ":" means all interfaces. [":8080"]
listen_addr: ":8080"

# WHICH ADDRESS COUNTS AS "THE CLIENT"   [false]
#
# Everything below that matches an address — ip_src_allowed, ops_ip_src_allowed, the
# lockout and its whitelist, the audit log, the access log, and the DDNS fallback that
# publishes your source address — uses one resolved address, decided by this flag:
#
#   false  the socket peer, i.e. the real TCP source. X-Forwarded-For and X-Real-IP are
#          IGNORED, because when anyone can reach us directly those headers are just
#          something the caller typed.
#   true   the RIGHT-MOST X-Forwarded-For entry (or X-Real-IP if there is no XFF): the
#          hop your proxy appended. Entries to its left came from the caller, so they
#          are not believed — a caller cannot pick which address it appears to come
#          from, and so cannot slip past ip_src_allowed, sit inside the lockout
#          whitelist, or dodge a lockout by rotating the value.
#
# Set true ONLY when nothing can reach teleddns except your proxy (bind it to loopback).
# With two hops in front — a CDN ahead of your proxy — the right-most entry is your
# proxy's view of the CDN, not the end user; that is not unwound yet.
#
# IPv4-mapped IPv6 (::ffff:a.b.c.d, what a dual-stack listener reports) is normalized to
# plain IPv4 everywhere, so a rule and an address always meet in the same form.
trust_proxy: false

# Source admission: which networks may reach the server at all, matched against the
# resolved address above. CIDRs, or bare addresses as single hosts; IPv4 and IPv6, and a
# rule in either form matches a client arriving in the other. Empty = no restriction.
# (Renamed: allowed_ips → ip_src_allowed, ops_allowed_ips → ops_ip_src_allowed. An
# unknown key is now a startup error, so a stale name is caught rather than silently
# dropping the gate.)   [no restriction]
# ip_src_allowed:
#   - "127.0.0.1/32"
#   - "10.0.0.0/8"

# The same, for /healthcheck and /metrics only: narrows ip_src_allowed further, so a
# caller must satisfy both lists.   [no extra restriction]
# ops_ip_src_allowed:
#   - "10.9.0.0/24"

# Verbose (debug-level) logging.   [false]
debug: false

# Brand shown in the web UI navbar (top-left).   ["TeleDDNS Server Manager"]
# ui_title: "TeleDDNS Server Manager"

# TTLs (seconds).
default_ttl: 3600   # records created via the management API / import   [3600]
ddns_rr_ttl: 60     # A/AAAA records touched via the DDNS endpoint      [60]

# Backend-sync timing.
backend_sync_delay:  "10s"    # worker tick / debounce before a push     ["10s"]
backend_sync_period: "300s"   # worker-liveness window for healthcheck   ["300s"]
warn_on_nopush:      "3600s"  # WARN if the oldest unfinished push is older ["3600s"]

# Audit log: every state-changing request is recorded in the (read-only) audit table.
# Rows older than this are pruned at startup; 0 = keep forever.   [365]
audit_retention_days: 365

# Brute-force lockout on the unauthenticated credential checks (login form, the TOTP
# step, DDNS HTTP Basic, bearer tokens). A locked subject is refused with 429 +
# Retry-After ("abuse" on DDNS) and its secret is never checked. The counters are rows
# in auth_username_lockout / auth_ip_lockout: the admin console lists them as "Locked
# accounts" / "Locked addresses", and deleting a row is the unlock (audited). Expired
# rows are pruned hourly by the sync worker.
#
# Per account — the console login and DDNS HTTP Basic share one budget per account, so
# whichever surface is guessed at, both lock. Cleared by a successful check. 0 = off.
username_lockout_after: 10
username_lockout_duration: "15m"
# Per client IP — the brake on bearer-token guessing (a token names no account) and on
# username spraying. While an address is locked, *valid* callers from it are refused
# too, so keep this well above what a misconfigured client produces if your users share
# an address (CGNAT, an office NAT). 0 = off.
#   Keyed on the resolved client address (see trust_proxy at the top) — the same address
#   the login form, DDNS, the APIs, the audit log and ip_src_allowed use.
ip_lockout_after: 100
ip_lockout_duration: "15m"
# Addresses that are never locked out: your office range, a monitoring probe, the NAT
# a device fleet shares. CIDRs or bare addresses, IPv4 and IPv6 — a rule written either
# way matches a client that arrives the other way — matched against the same resolved
# address as everything else (see trust_proxy). Note what that implies: with
# trust_proxy: false a caller cannot reach this list by sending a header, and with
# trust_proxy: true it still cannot, because only the hop your proxy appended is read.
# There is no username equivalent: an account that can never lock is an account whose
# password can be guessed at forever.
# ip_lockout_whitelist: ["203.0.113.0/24", "2001:db8::/32", "198.51.100.7"]

# How strictly a TYPED password is screened — on the profile page, on a manager's reset,
# and on the admin console's user form. All three, deliberately: whichever surface is
# left unscreened becomes the way around the others.
#
#   0  off
#   1  at least 8 characters
#   2  at least 12 characters                                          [default]
#   3  at least 12 plus upper + lower + digit + symbol, for audits that insist on it
#
# Every level above 0 also rejects common values and keyboard walks, one repeated
# character, any run of six consecutive characters, and a password containing the
# account's own username. Length first, per NIST SP 800-63B: demanding a character mix
# gets you "Password1!" and costs usability without buying anything a cracking ruleset
# doesn't already cover. Spaces, punctuation and emoji are all allowed, and nothing is
# truncated. This never governs `teleddns-server admin reset-password` or the first-start
# seed — a recovery path must always be able to set a password.
password_level: 2

# How long an idle console session survives before it must log in again, inside the
# unchanged 7-day absolute lifetime. "0" turns the idle clock off (absolute expiry only).
# A console left open on an unattended desk stops being a live credential.   ["8h"]
session_idle_timeout: "8h"

# Backend. "log" (default) just logs what it would push — safe for first boot
# and dev. "knot" writes <knot_zone_dir>/<origin>.zone, declares the zone in
# Knot's config DB as a member of <knot_template>, and runs `knotc zone-reload`.
backend: "log"
# backend: "knot"
# knot_zone_dir: "/var/lib/knot/zones"
# knotc_path: "knotc"
# knot_template: "master"
# After zone-reload, wait this long for Knot to actually serve the pushed SOA serial before
# treating the push as failed (a reload only means "accepted"). "0" disables the check.  ["5s"]
# knot_confirm_timeout: "5s"

# Single sign-on (OpenID Connect). Optional. A "Sign in with …" button appears on
# the login page per provider; the callback URL is <public_url>/login/sso/<name>/
# callback (register it at the IdP). group_rules run on every login and are
# reconciled onto the user; a rule on the username_claim (default email) matches
# the username by regex/equals, any other claim matches its value by equals. See
# README §SSO.
# public_url: "https://ddns.example.com"
# sso_providers:
#   - name: google                      # → /login/sso/google/callback
#     display_name: "Google"
#     issuer: "https://accounts.google.com"
#     client_id: "…"
#     client_secret: "…"
#     # username_claim: "email"         # default; the claim used as the local username
#     # auto_register: true             # default; create unknown users on first login
#     group_rules:
#       - regex: "@example\\.com$"       # matched against the username (email)
#         groups: ["example-users"]
#   - name: okta                        # → /login/sso/okta/callback
#     display_name: "Okta"
#     issuer: "https://dev-123.okta.com"
#     client_id: "…"
#     client_secret: "…"
#     scopes: ["email", "profile", "groups"]   # request the groups claim
#     group_rules:
#       - {claim: "groups", equals: "dns-operators", groups: ["example-ops"]}
